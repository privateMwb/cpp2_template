# ============================================================
# .github/workflows/update.yml
# Bumps the version and source hash in the Conan recipe, vcpkg
# port, and root CMakeLists.txt for a given v* tag.
# ============================================================

name: Update Package Recipes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to update recipes for (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: projname
      DNS_REPOSITORY: privateMwb/cpp2_template
      ROOT_DIR: .
      CONAN_RECIPE_DIR: packaging/recipes/projname/all
      VCPKG_PORT_DIR: packaging/vcpkg/ports/projname

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine source branch
        id: branch
        run: |
          SHA=$(git rev-list -n 1 "${{ steps.tag.outputs.tag }}")
          CANDIDATES=$(git branch -r --contains "$SHA" \
            | grep -v ' -> ' | grep -v 'HEAD' | sed 's#^ *origin/##')

          if [ -z "$CANDIDATES" ]; then
            echo "No remote branch contains $SHA" >&2
            exit 1
          fi

          DEFAULT="${{ github.event.repository.default_branch }}"

          if echo "$CANDIDATES" | grep -qx "$DEFAULT"; then
            BRANCH="$DEFAULT"
          else
            BRANCH=$(echo "$CANDIDATES" | head -n1)
          fi

          echo "Candidates: $(echo "$CANDIDATES" | tr '\n' ' ')"
          echo "Source branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download source archive
        run: |
          # Fetch by resolved commit SHA, not the tag string. portfile.cmake
          # pins REF to a raw commit SHA, and vcpkg_from_github downloads
          # archive/<REF>.tar.gz -- GitHub embeds the ref string into the
          # tarball's top-level folder name, so a tag-based archive
          # (archive/refs/tags/vX.tar.gz) has different bytes, and a
          # different hash, than the commit-based archive vcpkg actually
          # fetches. Downloading the same URL here keeps the SHA512 we
          # compute valid.
          curl -L \
            -o source.tar.gz \
            https://github.com/${{ env.DNS_REPOSITORY }}/archive/${{ steps.branch.outputs.sha }}.tar.gz

      - name: Download submodule archives
        run: |
          # Generic across any project reusing this workflow: submodules
          # are discovered from .gitmodules at runtime, not hardcoded here
          # by name. Projects with no .gitmodules (no vendored submodules)
          # produce an empty manifest and are otherwise unaffected --
          # update_package_files.py treats --submodules-manifest as
          # optional.
          #
          # git ls-tree reads each gitlink entry straight from the
          # superproject's tree at this commit, so the pinned submodule
          # commit is available without checking out submodule content at
          # all (no `submodules: recursive` needed on the Checkout step
          # above).
          echo "[]" > submodules.json

          if [ -f .gitmodules ]; then
            while read -r KEY PATH_; do
              NAME=$(basename "$PATH_")
              URL=$(git config --file .gitmodules --get "${KEY%.path}.url")
              REPO=$(echo "$URL" | sed -E 's#^https?://github\.com/##; s#\.git$##')

              SUB_SHA=$(git ls-tree "${{ steps.branch.outputs.sha }}" "$PATH_" | awk '{print $3}')
              if [ -z "$SUB_SHA" ]; then
                echo "Could not resolve a submodule commit for $NAME at $PATH_" >&2
                exit 1
              fi

              ARCHIVE="$NAME.tar.gz"
              curl -L -o "$ARCHIVE" "https://github.com/$REPO/archive/$SUB_SHA.tar.gz"

              jq --arg name "$NAME" --arg commit "$SUB_SHA" --arg archive "$ARCHIVE" \
                '. += [{"name": $name, "commit": $commit, "archive": $archive}]' \
                submodules.json > submodules.json.tmp
              mv submodules.json.tmp submodules.json

              echo "$NAME -> $SUB_SHA"
            done < <(git config --file .gitmodules --get-regexp '\.path$')
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update package files
        run: |
          python scripts/update_package_files.py \
            --package ${{ env.PACKAGE_NAME }} \
            --repo ${{ env.DNS_REPOSITORY }} \
            --version ${{ steps.tag.outputs.version }} \
            --commit ${{ steps.branch.outputs.sha }} \
            --archive source.tar.gz \
            --submodules-manifest submodules.json \
            --root-dir "$ROOT_DIR" \
            --conan-dir "$CONAN_RECIPE_DIR" \
            --vcpkg-dir "$VCPKG_PORT_DIR"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$ROOT_DIR/CMakeLists.txt" \
            "$VCPKG_PORT_DIR/portfile.cmake" \
            "$VCPKG_PORT_DIR/vcpkg.json" \
            "$CONAN_RECIPE_DIR/conanfile.py" \
            "$CONAN_RECIPE_DIR/conandata.yml"

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update package recipes for ${{ steps.tag.outputs.tag }}"
          git push origin HEAD:${{ steps.branch.outputs.branch }}