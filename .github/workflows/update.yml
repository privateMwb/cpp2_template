# ============================================================
# .github/workflows/update.yml
# Bumps the version and source hash in the Conan recipe, vcpkg
# port, and root CMakeLists.txt for a given v* tag.
# ============================================================

name: Update Package Recipes

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to update recipes for (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: projname
      PACKAGE_REPOSITORY: privateMwb/cpp2_template
      ROOT_DIR: .
      CONAN_RECIPE_DIR: packaging/recipes/projname/all
      VCPKG_PORT_DIR: packaging/vcpkg/ports/projname

    steps:

      # ----------------------------------------------------------
      # Resolve tag and version
      # ----------------------------------------------------------

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Tag: $TAG"
          echo "Version: $VERSION"

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # ----------------------------------------------------------
      # Determine the source branch and commit
      # ----------------------------------------------------------

      - name: Determine source branch
        id: branch
        run: |
          SHA=$(git rev-list -n 1 "${{ steps.tag.outputs.tag }}")

          if [ -z "$SHA" ]; then
            echo "Could not resolve tag commit."
            exit 1
          fi

          CANDIDATES=$(git branch -r --contains "$SHA" \
            | grep -v ' -> ' \
            | grep -v 'HEAD' \
            | sed 's#^ *origin/##')

          if [ -z "$CANDIDATES" ]; then
            echo "No remote branch contains $SHA" >&2
            exit 1
          fi

          DEFAULT="${{ github.event.repository.default_branch }}"

          if echo "$CANDIDATES" | grep -qx "$DEFAULT"; then
            BRANCH="$DEFAULT"
          else
            BRANCH=$(echo "$CANDIDATES" | head -n1)
          fi

          echo "Candidates: $(echo "$CANDIDATES" | tr '\n' ' ')"
          echo "Source branch: $BRANCH"
          echo "Source commit: $SHA"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Download source archive
      # ----------------------------------------------------------

      - name: Download source archive
        run: |
          # Download the archive using the exact commit SHA that will
          # be pinned by vcpkg.
          #
          # This is important because:
          #
          #   archive/<commit>.tar.gz
          #
          # produces different archive bytes from:
          #
          #   archive/refs/tags/<tag>.tar.gz
          #
          # Therefore the SHA512 calculated here must correspond to
          # the exact archive that vcpkg will download.

          curl -fL \
            -o source.tar.gz \
            "https://github.com/${{ env.PACKAGE_REPOSITORY }}/archive/${{ steps.branch.outputs.sha }}.tar.gz"

          if [ ! -s source.tar.gz ]; then
            echo "Failed to download source archive."
            exit 1
          fi

          echo "Source archive downloaded:"
          ls -lh source.tar.gz

      # ----------------------------------------------------------
      # Setup Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # ----------------------------------------------------------
      # Update package files
      # ----------------------------------------------------------

      - name: Update package files
        run: |
          python scripts/update_package_files.py \
            --package "$PACKAGE_NAME" \
            --repo "$PACKAGE_REPOSITORY" \
            --version "${{ steps.tag.outputs.version }}" \
            --commit "${{ steps.branch.outputs.sha }}" \
            --archive source.tar.gz \
            --root-dir "$ROOT_DIR" \
            --conan-dir "$CONAN_RECIPE_DIR" \
            --vcpkg-dir "$VCPKG_PORT_DIR"

      # ----------------------------------------------------------
      # Commit generated changes
      # ----------------------------------------------------------

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$ROOT_DIR/CMakeLists.txt" \
            "$VCPKG_PORT_DIR/portfile.cmake" \
            "$VCPKG_PORT_DIR/vcpkg.json" \
            "$CONAN_RECIPE_DIR/conanfile.py" \
            "$CONAN_RECIPE_DIR/conandata.yml"

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit \
            -m "Update package recipes for ${{ steps.tag.outputs.tag }}"

          git push \
            origin \
            "HEAD:${{ steps.branch.outputs.branch }}"