# ============================================================
# .github/workflows/coverage.yml
# Builds and runs the test suite with coverage instrumentation,
# uploading an HTML report, on every push and pull request.
# ============================================================

name: Coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ lcov ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-coverage-${{ hashFiles('tests/google_tests/CMakeLists.txt') }}

      # Benchmarks/regression tools/examples are skipped: instrumenting
      # a fetched third-party dependency (regression/ pulls in
      # nlohmann_json) with --coverage adds irrelevant, unowned
      # coverage noise and slows the build for no benefit.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_REGRESSION=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture \
            --directory build \
            --output-file coverage.info \
            --ignore-errors negative,gcov,mismatch

          lcov --remove coverage.info \
            '/usr/*' \
            '*/tests/*' \
            --output-file coverage.filtered.info

      - name: Generate HTML report
        run: |
          genhtml coverage.filtered.info \
            --output-directory coverage-html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html