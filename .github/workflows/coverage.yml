# ============================================================
# .github/workflows/coverage.yml
# Builds and runs the test suite with coverage instrumentation,
# uploading an HTML report, on every push and pull request.
# ============================================================

name: Coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ lcov ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: |
            ccache-coverage-

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-coverage-${{ hashFiles('tests/google_tests/CMakeLists.txt') }}

      # Benchmarks, regression tools, and examples are skipped.
      # The template may not contain any real library implementation
      # yet, so coverage is allowed to produce an empty source report.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_REGRESSION=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture \
            --directory build \
            --output-file coverage.info \
            --ignore-errors negative,gcov,mismatch

          lcov --extract coverage.info \
            '*/include/ProjName/*' \
            '*/src/ProjName/*' \
            --output-file coverage.filtered.info \
            --ignore-errors empty

      - name: Check coverage data
        id: coverage
        run: |
          if grep -q "^SF:" coverage.filtered.info; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            echo "No project source coverage found."
          fi

      - name: Generate HTML report
        if: steps.coverage.outputs.has_coverage == 'true'
        run: |
          genhtml coverage.filtered.info \
            --output-directory coverage-html

      - name: Upload HTML report
        if: steps.coverage.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html