# ============================================================
# .github/workflows/coverage.yml
# Builds and runs the test suite with coverage instrumentation.
#
# The template may initially contain no project source files
# under include/ProjName/ or src/ProjName/. In that case the
# coverage report is skipped rather than failing.
# ============================================================

name: Coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ lcov ccache

      # --------------------------------------------------------
      # Cache ccache
      # --------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: |
            ccache-coverage-

      # --------------------------------------------------------
      # Cache fetched CMake dependencies
      # --------------------------------------------------------
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-coverage-${{ hashFiles('tests/google_tests/CMakeLists.txt') }}
          restore-keys: |
            deps-coverage-

      # --------------------------------------------------------
      # Configure
      #
      # Benchmarks, regression tools, and examples are skipped.
      # They are not part of the library's coverage target.
      # --------------------------------------------------------
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_REGRESSION=OFF \
            -DBUILD_EXAMPLES=OFF

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build
        run: |
          cmake --build build --parallel

      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------
      - name: Run tests
        continue-on-error: true
        run: |
          ctest \
            --test-dir build \
            --output-on-failure

      # --------------------------------------------------------
      # Generate coverage data
      #
      # lcov captures everything under build first. We then
      # check whether the template actually contains project
      # source files before attempting to extract them.
      #
      # This is important because the template starts empty:
      #
      #   include/ProjName/
      #   src/ProjName/
      #
      # may not contain any files yet.
      # --------------------------------------------------------
      - name: Generate coverage report
        id: coverage
        run: |
          lcov --capture \
            --directory build \
            --output-file coverage.info \
            --ignore-errors negative,gcov,mismatch

          if grep -qE '^SF:.*(/src/ProjName/|/include/ProjName/)' coverage.info; then
            echo "Project source coverage found."

            lcov --extract coverage.info \
              '*/include/ProjName/*' \
              '*/src/ProjName/*' \
              --output-file coverage.filtered.info \
              --ignore-errors unused,empty

            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "No project source files found."
            echo "Skipping HTML coverage generation."
            echo "This is expected for the empty template."

            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # Generate HTML report
      # --------------------------------------------------------
      - name: Generate HTML report
        if: steps.coverage.outputs.has_coverage == 'true'
        run: |
          genhtml coverage.filtered.info \
            --output-directory coverage-html

      # --------------------------------------------------------
      # Upload HTML report
      # --------------------------------------------------------
      - name: Upload HTML report
        if: steps.coverage.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html