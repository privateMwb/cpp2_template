# ============================================================
# .github/workflows/build.yml
# Builds and runs the test suite across a matrix of OS,
# compiler, and build-type combinations.
# ============================================================

name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    name: "${{ matrix.os }} | ${{ matrix.compiler }} | ${{ matrix.build_type }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            compiler: GCC
            cxx: g++
            build_type: Debug

          - os: ubuntu-latest
            compiler: GCC
            cxx: g++
            build_type: Release

          - os: ubuntu-latest
            compiler: Clang
            cxx: clang++
            build_type: Debug

          - os: ubuntu-latest
            compiler: Clang
            cxx: clang++
            build_type: Release

          - os: windows-latest
            compiler: MSVC
            build_type: Debug

          - os: windows-latest
            compiler: MSVC
            build_type: Release

          - os: macos-latest
            compiler: AppleClang
            cxx: clang++
            build_type: Debug

          - os: macos-latest
            compiler: AppleClang
            cxx: clang++
            build_type: Release

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ clang ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      # MSVC skipped: ccache's MSVC support is unreliable enough that
      # it's not worth it for a cheap caching pass. Only the
      # FetchContent dependency cache below applies on Windows.
      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.compiler }}-${{ matrix.build_type }}/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('tests/google_tests/CMakeLists.txt') }}

      - name: Set compiler launcher flag
        id: launcher
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            echo "flag=-DCMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Only tests/ are exercised by this workflow (via ctest below).
      # Benchmarks, tools, and examples are disabled to reduce CI time.
      - name: Configure
        env:
          CXX: ${{ matrix.cxx || '' }}
        run: cmake -S . -B build-${{ matrix.compiler }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ steps.launcher.outputs.flag }} -DBUILD_BENCHMARKS=OFF -DBUILD_REGRESSION=OFF -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-${{ matrix.compiler }}-${{ matrix.build_type }} --config ${{ matrix.build_type }}

      - name: Run tests
        continue-on-error: true
        run: ctest --test-dir build-${{ matrix.compiler }}-${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure