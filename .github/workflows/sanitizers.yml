# ============================================================
# .github/workflows/sanitizers.yml
# Builds and runs the test suite under ASan/UBSan on every push
# and pull request.
# ============================================================

name: Sanitizers

on:
  push:
  pull_request:

jobs:
  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake clang ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-sanitizers-${{ github.sha }}
          restore-keys: ccache-sanitizers-

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-sanitizers-${{ hashFiles('tests/google_tests/CMakeLists.txt') }}

      # Benchmarks/regression tools/examples are skipped: instrumenting
      # a fetched third-party dependency (regression/ pulls in
      # nlohmann_json) with sanitizer flags wastes build time and
      # surfaces warnings this repo can't fix.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_REGRESSION=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure